<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEasy</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#f4f4f4;
}

/* NAVBAR */
nav{
    background:#111;
    color:white;
    padding:15px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.nav-links{
    display:flex;
    gap:20px;
}

.nav-links a{
    color:white;
    text-decoration:none;
}

.cart{
    background:#ff9800;
    padding:5px 10px;
    border-radius:20px;
}

.menu{
    display:none;
    font-size:25px;
    cursor:pointer;
}

/* HERO */
.hero{
    text-align:center;
    padding:50px 20px;
    background:white;
}

.hero h1{
    font-size:40px;
    margin-bottom:10px;
}

.hero p{
    color:gray;
}

/* PRODUCTS */
.products{
    padding:40px 5%;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    text-align:center;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
    border-radius:8px;
}

.card h3{
    margin:15px 0;
}

.price{
    color:#ff9800;
    font-weight:bold;
}

button{
    margin-top:10px;
    padding:10px 15px;
    border:none;
    background:#111;
    color:white;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#333;
}

/* FOOTER */
footer{
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}

/* MOBILE */
@media(max-width:768px){
    .nav-links{
        position:absolute;
        top:60px;
        right:0;
        background:#111;
        flex-direction:column;
        width:200px;
        padding:20px;
        display:none;
    }

    .nav-links.active{
        display:flex;
    }

    .menu{
        display:block;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
    <div class="logo">ShopEasy</div>
    <div class="menu" onclick="toggleMenu()">☰</div>
    <div class="nav-links" id="navLinks">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Contact</a>
        <span class="cart">Cart: <span id="cartCount">0</span></span>
    </div>
</nav>

<!-- HERO -->
<section class="hero">
    <h1>Welcome to ShopEasy</h1>
    <p>Best products at affordable prices</p>
</section>

<!-- PRODUCTS -->
<section class="products">

    <div class="card">
        <img src="https://picsum.photos/300/200?1">
        <h3>Wireless Headphones</h3>
        <p class="price">₹1999</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300/200?2">
        <h3>Smart Watch</h3>
        <p class="price">₹2999</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300/200?3">
        <h3>Running Shoes</h3>
        <p class="price">₹2499</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300/200?4">
        <h3>Backpack</h3>
        <p class="price">₹1499</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

</section>

<!-- FOOTER -->
<footer>
    © 2026 ShopEasy | All Rights Reserved
</footer>

<script>
let count = 0;

function addToCart(){
    count++;
    document.getElementById("cartCount").innerText = count;
}

function toggleMenu(){
    document.getElementById("navLinks").classList.toggle("active");
}
</script>

</body>
</html>
